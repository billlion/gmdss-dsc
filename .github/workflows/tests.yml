name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - run: python -m pip install ".[audio]"
      - run: python -c "import sounddevice; print(sounddevice.get_portaudio_version())"
      - run: python -m unittest discover -s tests -v
      - run: dsc decode examples/gmdss1_clean.wav --centre 975
